name: IEEE highlighted diff diagnostic

on:
  push:
    branches:
      - tmp-ieee-highlight-build-20260922

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Get latexdiff and manuscript inputs
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/ftilmann/latexdiff/master/latexdiff -o /tmp/latexdiff
          chmod +x /tmp/latexdiff
          curl -fL 'https://ucb145425fea013567c084188a5b.dl.dropboxusercontent.com/cd/0/get/DInV3pJXXaLYGt57L1jhfrcdGty33tJFOz0hGa2p5FiY7PwrBvQhvmWB-K263RL0d3ZHBv9NB_dV7_AMgTC7R8okPrkMxwehD49Er9-znEcsPvNUh0wlqPh06chpBIMR_cyMppyPL21SKdBa0Tjpsaz7Z_5fEnL4yXXOWD9fVRb5DQ/file?c_luid=0ef9c1d7' -o /tmp/july.zip
          curl -fL 'https://uc1abc2f11315e0baa3bc1ebf557.dl.dropboxusercontent.com/cd/0/get/DIn7nUbfxT7kjl0bWNIDlUq-TSCCr81fUIwC5HVC8B5ckRFm7qlcH556tkjsmJcnsBnjfqyyPEqV5JqyRKhXOw9ne-8OW-rApOvc6W5rLB5GL-9YSX0vFUqF8zFeORWOEUtEremD3cnA-CbweSGIUr__zDG_NPIuMYo9eGgxwWn6Mg/file?c_luid=0ef9c1d7' -o /tmp/final.tex
          mkdir -p /tmp/ieee
          unzip -q /tmp/july.zip -d /tmp/ieee
          BASE="$(dirname "$(find /tmp/ieee -type f -name 'IEEE_ACCESS_ML_Drug.tex' | head -n 1)")"
          cp "$BASE/IEEE_ACCESS_ML_Drug.tex" "$BASE/July2026_forDIFF.tex"
          cp /tmp/final.tex "$BASE/IEEE_ACCESS_ML_Drug.tex"
          cd "$BASE"
          set +e
          /tmp/latexdiff --type=UNDERLINE --disable-citation-markup --floattype=FLOATSAFE July2026_forDIFF.tex IEEE_ACCESS_ML_Drug.tex > highlighted.tex
          echo "latexdiff status=$?"
          set -e
          echo '=== DIF PREAMBLE ==='
          grep -n -E 'DIF(add|del)(FL)?|ulem' highlighted.tex | head -n 30 || true
          echo '=== TOPRULE CONTEXTS ==='
          grep -n -B6 -A6 '\\toprule' highlighted.tex | head -n 240 || true
          echo '=== PROBLEM PATTERNS ==='
          grep -n -E 'DIF(add|del)(begin|end)FL.*\\(toprule|midrule|bottomrule)|\\begin\{tabular\}.*DIF' highlighted.tex | head -n 100 || true
