[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toxicity-screening"
version = "1.0.0"
description = "Reliability-centered molecular toxicity prediction under scaffold shift"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "BSD-3-Clause"}
authors = [{name = "Yassine Benachour"}]
dependencies = [
  "numpy==1.26.4", "pandas==2.2.3", "scipy==1.14.1",
  "rdkit==2023.9.6", "scikit-learn==1.5.2", "joblib==1.4.2",
  "PyYAML==6.0.2", "requests==2.32.3", "matplotlib==3.9.2"
]

[project.optional-dependencies]
ml = ["xgboost==2.1.3", "optuna==4.1.0", "shap==0.46.0"]
deep = ["torch==2.5.1", "torch-geometric==2.6.1", "captum==0.7.0"]
data = ["pytdc==1.1.15", "pyarrow==18.1.0"]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "black==24.10.0", "ruff==0.8.4", "mypy==1.13.0"]

[project.scripts]
toxicity-screen = "toxicity_screening.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
